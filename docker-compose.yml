version: '3.8'

services:
  # ==================== INFRASTRUCTURE ====================
  postgres:
    image: postgres:16-alpine
    container_name: tele-eye-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tele_eye
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tele-eye-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: tele-eye-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - tele-eye-network

  # ==================== MICROSERVICES ====================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: tele-eye-auth
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tele_eye
      JWT_SECRET: tele-eye-jwt-secret-key
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - tele-eye-network

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: tele-eye-user
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tele_eye
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - tele-eye-network

  booking-service:
    build:
      context: ./services/booking-service
      dockerfile: Dockerfile
    container_name: tele-eye-booking
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tele_eye
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - tele-eye-network

  medical-service:
    build:
      context: ./services/medical-service
      dockerfile: Dockerfile
    container_name: tele-eye-medical
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      PORT: 8084
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tele_eye
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - tele-eye-network

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: tele-eye-payment
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      PORT: 8085
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tele_eye
      VNPAY_TMN_CODE: your_tmn_code
      VNPAY_HASH_SECRET: your_hash_secret
      VNPAY_URL: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - tele-eye-network

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: tele-eye-notification
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      PORT: 8086
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USER: your_email@gmail.com
      MAIL_PASS: your_app_password
    depends_on:
      rabbitmq:
        condition: service_started
    networks:
      - tele-eye-network

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: tele-eye-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      MEDICAL_SERVICE_URL: http://medical-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      JWT_SECRET: tele-eye-jwt-secret-key
    depends_on:
      - auth-service
      - user-service
      - booking-service
      - medical-service
      - payment-service
      - notification-service
    networks:
      - tele-eye-network

  # ==================== FRONTEND ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tele-eye-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    depends_on:
      - api-gateway
    networks:
      - tele-eye-network

volumes:
  postgres_data:

networks:
  tele-eye-network:
    driver: bridge
